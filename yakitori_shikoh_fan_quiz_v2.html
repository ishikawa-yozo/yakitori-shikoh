<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>やきとり志幸 ファン検定</title><style>
:root{font-family:"Yu Gothic",Meiryo,sans-serif;color:#fff8e9;background:#251513}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#673329,#241513 65%);min-height:100vh}main{max-width:650px;margin:auto;padding:20px 16px 55px}.top{text-align:center;padding:24px 0}.lantern{font-size:60px;filter:drop-shadow(0 0 12px #d95637)}h1{font-size:clamp(28px,7vw,42px);margin:8px 0;color:#ffe4a4}.sub{color:#f2c982}.panel{background:#fff9ed;color:#34211b;border-radius:18px;padding:26px 22px;box-shadow:0 14px 30px #10090788}.btn,.choice{font:inherit;border:0;cursor:pointer;border-radius:12px;padding:15px 18px}.btn{background:#9d2924;color:white;font-weight:bold;width:100%;margin-top:12px}.btn:hover{background:#bd3931}.choice{width:100%;display:block;text-align:left;background:#f4e8d7;color:#35211b;margin:10px 0;border:2px solid transparent}.choice:hover:not(:disabled){border-color:#a33d2f}.choice:disabled{cursor:default}.correct{background:#d9f1d9;border-color:#2c803e}.wrong{background:#f8d7d7;border-color:#b33b3b}.muted{color:#745b4d}.bar{height:8px;background:#e5d4bc;border-radius:10px;overflow:hidden;margin:14px 0}.bar>div{height:100%;background:#b5372d;transition:width .2s}.feedback{background:#f5e8d1;border-radius:10px;padding:12px;margin-top:14px}input{font:inherit;padding:14px;width:100%;border:1px solid #cdb99b;border-radius:10px;margin:8px 0}#certificate{background:#fff8e8;color:#352016;border:9px double #c39b46;text-align:center;padding:24px 14px;margin:18px 0;border-radius:8px}#certificate h2{font-size:30px;color:#8d2622;margin:12px 0}#certificate .name{font-size:30px;font-weight:bold;overflow-wrap:anywhere;border-bottom:1px solid #a88c62;padding:16px 0}.gold{color:#8e651b}.small{font-size:13px}.hidden{display:none!important}footer{text-align:center;color:#cfac98;font-size:12px;margin-top:28px}@media print{body{background:white}main{padding:0;max-width:none}.top,.panel>*:not(#certificate),footer{display:none!important}.panel{box-shadow:none;padding:0}#certificate{display:block!important;min-height:240mm;padding:35mm 12mm;border:12px double #c39b46;break-inside:avoid}@page{size:A4;margin:10mm}}
</style></head><body><main><header class="top"><div class="lantern">🏮</div><h1>やきとり志幸<br>ファン検定</h1><div class="sub">大船の人情と、やりとりを楽しもう 🍢</div></header><section class="panel"><div id="start"><h2>いざ、志幸通への挑戦！</h2><p>50問からランダムで5問出題。<strong>4問以上正解で「志幸ファン認定証」</strong>を発行します。</p><p class="muted">3択・何度でも挑戦OK。問題にはお店の歴史やご家族だけが知るエピソードが含まれます。</p><button class="btn" onclick="startQuiz()">検定をはじめる 🍢</button></div><div id="quiz" class="hidden"><div id="progress"></div><div class="bar"><div id="fill"></div></div><h2 id="question"></h2><div id="choices"></div><div id="feedback" class="feedback hidden"></div><button id="next" class="btn hidden" onclick="nextQuestion()">次の問題へ →</button></div><div id="result" class="hidden"><h2 id="resultTitle"></h2><p id="score"></p><div id="pass" class="hidden"><label for="fanName">認定証に記載するお名前</label><input id="fanName" maxlength="40" placeholder="例：志幸 太郎" oninput="updateCertificate()"><div id="certificate"><div style="font-size:42px">🏮 🍢 🏮</div><p class="gold">やきとり志幸</p><h2>ファン認定証</h2><p>あなたを「やきとり志幸ファン」として認定します</p><div class="name" id="certName">あなたのお名前</div><p id="certScore"></p><p>大船の温かな「やりとり」を<br>これからも楽しんでください！</p><p class="gold" id="certDate"></p><p class="small">やきとり志幸 ファン検定</p></div><button class="btn" onclick="window.print()">認定証を印刷・PDF保存 🖨️</button></div><button class="btn" onclick="startQuiz()">もう一度挑戦する 🔁</button></div></section><footer>※ファン向け非公式サンプルです。店舗による監修・認定ではありません。<br>店舗情報は公開前にご確認ください。</footer></main><script>
const BANK=[{"q":"昔、アジのたたき用に店内に置かれていたものは？","options":["大型冷凍庫","いけす型の模型","アジの水槽"],"answer":2,"explanation":"昔はアジのたたき用の水槽がありました。"},{"q":"昔の志幸で提供していた珍しい肉料理は？","options":["ラムチョップ","馬刺し","鹿肉のステーキ"],"answer":1,"explanation":"かつて馬刺しを提供していました。"},{"q":"昔のメニューにあった、うなぎを使った串料理は？","options":["うなぎの肝焼き","うなぎの白焼き","うなぎの蒲焼き丼"],"answer":0,"explanation":"うなぎの肝焼きが昔のメニューにありました。"},{"q":"昔の志幸で出していた、今では驚かれる串焼きは？","options":["ダチョウ","七面鳥","すずめ"],"answer":2,"explanation":"昔は「すずめ」もメニューにありました。"},{"q":"長男が仕入れる特別メニューのブランド豚は？","options":["イベリコ豚","みやじ豚","三元豚"],"answer":1,"explanation":"みやじ豚の備長炭すみ火串焼きです。"},{"q":"みやじ豚の特別串焼きで使う炭は？","options":["備長炭","竹炭","練炭"],"answer":0,"explanation":"みやじ豚を備長炭の炭火で串焼きにします。"},{"q":"店主のお母さんの出身県は？","options":["秋田県","新潟県","山形県"],"answer":2,"explanation":"お母さんは山形県上山市の生まれです。"},{"q":"店主のお母さんの出身市は？","options":["酒田市","上山市","米沢市"],"answer":1,"explanation":"山形県上山市の生まれです。"},{"q":"長男の経営支援の専門資格は？","options":["中小企業診断士","社会保険労務士","行政書士"],"answer":0,"explanation":"長男は中小企業診断士です。"},{"q":"長男がAI・IT開発で主に支援する業界は？","options":["飲食業・美容業","農業・漁業","建設業・製造業"],"answer":2,"explanation":"建設業・製造業向けAI・IT開発を行っています。"},{"q":"長男がAI・IT開発と並行して支援するものは？","options":["輸入代行","補助金","不動産仲介"],"answer":1,"explanation":"長男は補助金支援にも携わっています。"},{"q":"長男が創作活動で生かしていると語る能力は？","options":["小説を書く力","写真撮影技術","陶芸技術"],"answer":0,"explanation":"小説家としての表現力を生かして作詞作曲をしています。"},{"q":"長男の創作活動として正しいものは？","options":["彫刻制作","書道指導","作詞作曲"],"answer":2,"explanation":"長男は作詞作曲も手がけています。"},{"q":"長男の小説家としての力を認めたとされる関係者は？","options":["大学の考古学研究者","劇団四季の顧問・ダンサー・歌手","プロ野球の監督・選手"],"answer":1,"explanation":"劇団四季の顧問、ダンサー、歌手から評価されたというエピソードです。"},{"q":"店主の旦那さんが務めた土建組合での役割は？","options":["会計","広報","書記長"],"answer":0,"explanation":"旦那さんは土建組合の会計を務めました。"},{"q":"店主の旦那さんの以前の職業は？","options":["路線バス運転士","船長","クレーンオペレーター"],"answer":2,"explanation":"以前はクレーンオペレーターでした。"},{"q":"次男の職業は？","options":["自衛官","消防士","警察官"],"answer":1,"explanation":"次男は消防士です。"},{"q":"次男が携わる消防の分野は？","options":["救急","消防設備の販売","火災保険の査定"],"answer":0,"explanation":"次男は救急に携わっています。"},{"q":"志幸が使われたと伝わる映画の出演俳優は？","options":["高倉健","渡哲也","山崎努"],"answer":2,"explanation":"山崎努さんが出演した映画とのことです。作品名は公開前に正式表記を確認してください。"},{"q":"志幸が使われたと伝わる映画のタイトルは？","options":["幸福の黄色いハンカチ","九門のとき","七人の侍"],"answer":1,"explanation":"いただいた情報では「九門のとき」です。正式な作品名は要確認です。"},{"q":"店内のカレンダーに描かれている人物は？","options":["マリリン・モンロー","オードリー・ヘプバーン","グレース・ケリー"],"answer":0,"explanation":"店内にはマリリン・モンローのカレンダーがあります。"},{"q":"店主と腕を組んで写真に写っている宇宙飛行士は？","options":["向井千秋さん","野口聡一さん","山崎直子さん"],"answer":2,"explanation":"宇宙飛行士の山崎直子さんとの写真が飾られています。"},{"q":"志幸の支払い方法は？","options":["電子マネーのみ","現金のみ","クレジットカードのみ"],"answer":1,"explanation":"お会計は現金のみです。"},{"q":"店主が得意な歌手は？","options":["美空ひばり","松田聖子","中島みゆき"],"answer":0,"explanation":"店主は美空ひばりさんの歌が得意です。"},{"q":"店主が歌で受賞した賞は？","options":["全国大会の金賞","世界大会の優勝","地域の銀賞"],"answer":2,"explanation":"地域の歌の催しで銀賞を受賞したことがあります。"},{"q":"店主が志幸以外に経営していたお店は？","options":["喫茶店","カラオケ店","花屋"],"answer":1,"explanation":"以前はカラオケのお店も経営していました。現在はありません。"},{"q":"お店に飾られた能面の作者は？","options":["店主の兄","店主の長男","地元の陶芸家"],"answer":0,"explanation":"能面は店主のお兄さんが作りました。"},{"q":"お店に飾られた日本凧の作者は？","options":["店主の旦那さん","常連の画家","店主の兄"],"answer":2,"explanation":"日本凧も店主のお兄さんの作品です。"},{"q":"能面と日本凧の共通点は？","options":["どちらも映画の小道具","どちらも店主の兄の手作り","どちらも海外で購入"],"answer":1,"explanation":"両方とも店主のお兄さんが作ったものです。"},{"q":"長男がお店を手伝い始めたのはいつ？","options":["高校生のとき","小学生のとき","社会人になってから"],"answer":0,"explanation":"長男は高校時代から手伝っていました。"},{"q":"高校時代の長男がしていた大変な仕事は？","options":["店内の壁を塗る","お酒を醸造する","朝〆の鶏を串に刺す"],"answer":2,"explanation":"朝〆の鶏を串に刺す作業はとても大変だったそうです。"},{"q":"高校生の長男が串に刺していたのは？","options":["こんにゃく","朝〆の鶏","冷凍エビ"],"answer":1,"explanation":"朝〆の鶏を串に刺していました。"},{"q":"80代後半の店主が店を切り盛りできる理由は？","options":["お客さんが手伝ってくれるから","全自動ロボットがいるから","完全予約制だから"],"answer":0,"explanation":"常連さんたちの手助けが大きな力になっています。"},{"q":"お母さんが長男に伝えた印象的な言葉の前半は？","options":["お金を貯めなさい","一人でやりなさい","仲間を増やしなさい"],"answer":2,"explanation":"「仲間を増やしなさい、そしてその中から選びなさい」です。"},{"q":"「仲間を増やしなさい」に続く言葉は？","options":["そしてすぐに旅に出なさい","そしてその中から選びなさい","そして全員を雇いなさい"],"answer":1,"explanation":"お母さんから長男への印象深い言葉です。"},{"q":"志幸の定休日は？","options":["年中無休","毎週月曜日","毎週日曜日"],"answer":0,"explanation":"ご提供の情報では年中無休です。"},{"q":"志幸は大晦日に営業する？","options":["必ず休む","昼だけ休む","営業する"],"answer":2,"explanation":"大晦日も営業するとのことです。"},{"q":"志幸は元旦に営業する？","options":["毎年抽選で決める","営業する","必ず休む"],"answer":1,"explanation":"元旦も営業するとのことです。"},{"q":"志幸の営業時間の開始は？","options":["午後2時","午前11時","午後5時"],"answer":0,"explanation":"営業時間は午後2時から午後10時です。"},{"q":"志幸の営業時間の終了は？","options":["午後8時","午前0時","午後10時"],"answer":2,"explanation":"営業時間は午後2時から午後10時です。"},{"q":"営業時間は全部で何時間？","options":["10時間","8時間","6時間"],"answer":1,"explanation":"午後2時から午後10時まで、8時間です。"},{"q":"次のうち、昔の志幸のメニューにあった組み合わせは？","options":["馬刺し・すずめ","フォアグラ・キャビア","ピザ・パスタ"],"answer":0,"explanation":"昔は馬刺しやすずめも提供していました。"},{"q":"次のうち、昔の志幸のメニューにあった組み合わせは？","options":["チーズフォンデュ・パエリア","ローストビーフ・グラタン","うなぎの肝焼き・アジのたたき"],"answer":2,"explanation":"うなぎの肝焼きとアジのたたきにまつわる水槽がありました。"},{"q":"特別なみやじ豚串焼きを仕入れるのは誰？","options":["店主の兄","長男","次男"],"answer":1,"explanation":"長男が仕入れる特別メニューです。"},{"q":"店内に飾られた宇宙飛行士との写真で、店主はどうしている？","options":["腕を組んでいる","握手をしている","敬礼している"],"answer":0,"explanation":"山崎直子さんと腕を組んだ写真です。"},{"q":"お母さんの故郷はどの組み合わせ？","options":["福島県・郡山市","宮城県・石巻市","山形県・上山市"],"answer":2,"explanation":"山形県上山市の生まれです。"},{"q":"長男と次男の仕事の組み合わせは？","options":["教師と医師","中小企業診断士と消防士","弁護士と料理人"],"answer":1,"explanation":"長男は中小企業診断士、次男は救急に携わる消防士です。"},{"q":"店主の兄が作ったものとして正しいのは？","options":["能面と日本凧","陶器と時計","絵画と椅子"],"answer":0,"explanation":"店内に飾られた能面と日本凧は店主のお兄さんの作品です。"},{"q":"店主がかつて経営したカラオケ店は現在どうなっている？","options":["今も営業中","全国に展開中","現在はない"],"answer":2,"explanation":"以前のお店で、今はありません。"},{"q":"志幸で電子マネーを使って会計できる？","options":["QR決済だけ使える","できない","交通系ICだけ使える"],"answer":1,"explanation":"現金のみの会計です。"}];
let selected=[],index=0,score=0,answered=false;
const $=id=>document.getElementById(id);
function show(id){['start','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}
function startQuiz(){selected=[...BANK].sort(()=>Math.random()-.5).slice(0,5).map(q=>({...q,options:q.options.map((t,i)=>({t,correct:i===q.answer})).sort(()=>Math.random()-.5)}));index=0;score=0;show('quiz');render()}
function render(){answered=false;const q=selected[index];$('progress').textContent=`第 ${index+1} 問 / 5 問`;$('fill').style.width=`${index/5*100}%`;$('question').textContent=q.q;$('choices').replaceChildren();$('feedback').classList.add('hidden');$('next').classList.add('hidden');q.options.forEach(o=>{const b=document.createElement('button');b.className='choice';b.textContent=o.t;b.onclick=()=>choose(b,o.correct);$('choices').appendChild(b)})}
function choose(btn,correct){if(answered)return;answered=true;if(correct)score++;const q=selected[index];[...$('choices').children].forEach((b,i)=>{b.disabled=true;if(q.options[i].correct)b.classList.add('correct')});if(!correct)btn.classList.add('wrong');$('feedback').textContent=(correct?'⭕ 正解！ ':'❌ 残念！ ')+q.explanation;$('feedback').classList.remove('hidden');$('next').textContent=index===4?'結果を見る →':'次の問題へ →';$('next').classList.remove('hidden');$('fill').style.width=`${(index+1)/5*100}%`}
function nextQuestion(){index++;if(index<5)render();else finish()}
function finish(){show('result');const pass=score>=4;$('resultTitle').textContent=pass?'🎉 ファン認定おめでとう！':'🍢 あと少し！';$('score').textContent=`5問中 ${score} 問正解（合格は4問以上）`;$('pass').classList.toggle('hidden',!pass);$('certScore').textContent=`検定成績：5問中 ${score} 問正解`;$('certDate').textContent=new Date().toLocaleDateString('ja-JP',{year:'numeric',month:'long',day:'numeric'});$('fanName').value='';updateCertificate()}
function updateCertificate(){$('certName').textContent=$('fanName').value.trim()||'あなたのお名前'}
</script></body></html>
